# GoReleaser v2 configuration.
# Docs: https://goreleaser.com
version: 2

project_name: ft

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # ft only targets Ubuntu servers.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    **Full Changelog**: https://github.com/ABT-Tech-Limited/ft/compare/{{ .PreviousTag }}...{{ .Tag }}
